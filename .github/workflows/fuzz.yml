name: fuzz
on:
  schedule: [{ cron: '23 18 * * 0' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds per target
        default: '600'
      only:
        description: One target to run alone (empty runs every target)
        default: ''
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Every target on x86_64 (ubuntu-24.04) and on native aarch64 (ubuntu-24.04-arm), with ASan.
  fuzz:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      # Two fuzz jobs at a time, at most.
      max-parallel: 2
      matrix:
        arch: [x64, arm64]
        # `only` (dispatch input) narrows the matrix to one target, for a re-run after a fix.
        target: ${{ fromJSON(inputs.only && format('["{0}"]', inputs.only) || '["content_lexer","content_walk","jbig2_decode","jbig2_decode_globals","jbig2_roundtrip","embed_png","embed_jpeg","embed_jp2","transcode_png","build_pdf","image_decode","xmp","provenance_json","pixels","dct_parse","sfnt","cff","type1","inspect","extract","render","optimize","go_sort","stamp","replace_images","build_from_pages","provenance"]') }}
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: byblos-fuzz:local
          cache-from: type=gha,scope=byblos-rs-fuzz-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=byblos-rs-fuzz-${{ matrix.arch }}
      # The corpus is kept between runs: restored here, copied into the container, copied back
      # out and saved, so a run goes on from where the last one stopped. One cache per target and
      # architecture; the newest is restored.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-
      # docker create + start, not a RUN layer: a BuildKit cache hit would skip the fuzzing.
      # Seeds: tests/fuzz/seeds/<target> (committed), and for the targets that read a file (the PDF,
      # image, JBIG2 and font ones) tests/fuzz/seeds/data, which the image builds from the small
      # test inputs (under 300 KB) and a sample of the `-gen` outputs; new inputs go to the first
      # corpus dir. -timeout is the hard stop for one input; -rss_limit_mb and -malloc_limit_mb
      # make an allocation outside the limits a crash.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} byblos-fuzz:local \
            sh -c 'SEEDS=tests/fuzz/seeds/$TARGET; case $TARGET in go_sort|content_lexer|content_walk|jbig2_roundtrip|build_pdf|pixels|provenance_json|xmp) ;; *) SEEDS="$SEEDS tests/fuzz/seeds/data";; esac; cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET $SEEDS -- -max_total_time=$MAX_TOTAL_TIME -timeout=20 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.arch }}-${{ matrix.target }}
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-${{ github.run_id }}
